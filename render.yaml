services:
  - type: web
    name: vetpaw
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn app:app"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: vetpaw-db
          property: connectionString

databases:
  - name: vetpaw-db
    plan: free
    databaseName: vetpaw
    user: vetpaw_user
